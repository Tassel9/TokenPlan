# Prometheus 配置文件 — UrbanOps 市政运维智能体

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'urbanops'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # UrbanOps 主应用指标
  - job_name: 'urbanops-app'
    static_configs:
      - targets: ['urbanops:8000']
        labels:
          service: 'urbanops'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
