schema_version: 1
id: urbanops-alert-work-order-003
name: 告警上报与维修工单双诉求
group: coordination
tier: smoke
tags: [multi_intent, operation, exact_route]
turns:
  - 请上报泵站 P-102 的高温告警，并为这个异常创建维修工单。
expect:
  answer:
    contains_groups:
      - [告警, 上报, 异常]
      - [工单, 维修]
    contains_none: [一定完成, 肯定完成]
  route:
    intents_exact: [alert_report, work_order_handling]
    agents_all: [business_operation]
  tools:
    must_call: [business_operation]
  trace:
    events_all: [INTENTS_ROUTED, REQUEST_FINISHED]
judge:
  goal: 同时处理告警上报和维修工单两个独立结果，区分申请受理与最终完成，不得作绝对承诺。
