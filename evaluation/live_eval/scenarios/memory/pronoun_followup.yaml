schema_version: 1
id: urbanops-memory-pronoun-004
name: 多轮设施指代与排障延续
group: memory
tier: regression
tags: [multi_turn, reference_resolution, troubleshooting]
turns:
  - 泵站 P-102 出现高温告警，我要排查它。
  - 已经记录负载和环境温度了，下一步检查什么？
expect:
  answer:
    contains_any: [供电, 传感器, 冷却, 润滑, 机械部件, 控制柜]
    contains_none: [重新记录负载和环境温度, 已经修复]
  route:
    intents_all: [facility_troubleshooting]
    agents_all: [rag_knowledge]
  tools:
    must_call: [knowledge_search]
  evidence:
    min_count: 1
judge:
  goal: 第二轮应承接 P-102 和已经完成的检查项，给出尚未执行的下一步，不得重复要求用户从头排查或声称已修复。
