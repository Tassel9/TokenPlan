schema_version: 1
id: tokenplan-memory-pronoun-004
name: 多轮订单指代与退款延续
group: memory
tier: regression
tags: [multi_turn, reference_resolution, refund]
turns:
  - 我有两笔订单 TP-1001 和 TP-1002，第二笔重复扣款了。
  - 帮我退第二笔。
expect:
  answer:
    contains_any: [TP-1002, 第二笔, 退款, 订单]
    contains_none: [TP-1001 已退款, 已经到账]
  route:
    intents_all: [refund_handling]
judge:
  goal: 第二轮应承接 TP-1002，而不是误用第一笔订单；只能说明退款申请或后续核验，不能声称款项已经到账。
