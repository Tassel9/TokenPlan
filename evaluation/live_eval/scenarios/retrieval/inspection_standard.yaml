schema_version: 1
id: urbanops-inspection-standard-001
name: 泵站巡检规范查询
group: retrieval
tier: smoke
tags: [single_turn, knowledge, evidence]
turns:
  - 泵站日常巡检需要记录哪些基础信息？
expect:
  answer:
    contains_any: [设施编号, 点位, 时间, 现场状态]
    contains_none: [已经巡检, 已完成巡检]
  route:
    intents_exact: [inspection_standard_query]
    agents_exact: [rag_knowledge]
    escalated: false
  tools:
    must_call: [knowledge_search]
    successful: [knowledge_search]
  evidence:
    min_count: 1
  trace:
    events_all: [REQUEST_STARTED, INTENTS_ROUTED, REQUEST_FINISHED]
judge:
  goal: 回答泵站巡检应记录的基础信息，并明确知识规范不能替代现场检查；不得声称已完成巡检。
metadata:
  source: builtin municipal knowledge
