schema_version: 1
id: urbanops-ambiguous-cancel-005
name: 无上下文取消请求应澄清
group: routing
tier: regression
tags: [ambiguity, ask_user, no_dispatch]
turns:
  - 帮我把它取消掉。
expect:
  answer:
    contains_any: [请问, 哪个, 巡检任务, 工单, 补充]
