    intents_exact: []
    agents_exact: []
    response_action_any: [ASK_USER]
    escalated: false
  tools:
    max_total: 0
judge:
  goal: 在对象无法确定时提出最少且明确的澄清问题，不得擅自取消巡检任务、工单或其他对象。
